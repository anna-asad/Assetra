<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assetra - Profile</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/profile.css">
    <style>
        .header {
            border-bottom: 4px solid #fa3bda;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            position: relative;
            z-index: 100;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="menu-icon menu-toggle">☰</div>
            <h1 class="logo">ASSETRA</h1>
        </div>
        <div class="header-right">
            <span class="user-name" id="userName">User</span>
            <div class="user-avatar"></div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </header>

    <main class="main-content">
        <h2 class="page-title">My Profile</h2>

        <div class="profile-container">
            <div class="profile-card">
<div class="profile-header">
                    <div class="profile-avatar-large" id="profileAvatarContainer">
                        <span class="avatar-initials" id="avatarInitials">?</span>
                        <img id="profilePicture" class="avatar-picture" src="" alt="Profile Picture" style="display: none;">
                        <button class="avatar-edit-btn" onclick="openProfilePictureModal()" title="Change Picture">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </button>
                    </div>
                    <h3 id="profileName">Loading...</h3>
                    <span class="role-badge" id="profileRole">User</span>
                    <div class="profile-actions">
                        <button class="profile-btn profile-btn-primary" id="editProfileBtn" type="button">Edit Profile</button>
                    </div>
                </div>

                <div class="profile-details">
                    <div class="detail-row">
                        <span class="detail-label">Username:</span>
                        <span class="detail-value" id="profileUsername">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email:</span>
                        <span class="detail-value" id="profileEmail">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Role:</span>
                        <span class="detail-value" id="profileRoleText">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Department:</span>
                        <span class="detail-value" id="profileDepartment">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Account Created:</span>
                        <span class="detail-value" id="profileCreated">-</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div class="modal" id="editProfileModal">
        <div class="modal-content profile-modal-content">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <button class="modal-close" id="closeEditProfileModalBtn" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <div class="error-message" id="editProfileError" style="display:none;"></div>
                <form id="editProfileForm">
                    <div class="form-row">
                        <label class="form-label" for="editFullName">Full name</label>
                        <input class="form-input" id="editFullName" name="full_name" type="text" autocomplete="name" />
                    </div>
                    <div class="form-row">
                        <label class="form-label" for="editEmail">Email</label>
                        <input class="form-input" id="editEmail" name="email" type="email" autocomplete="email" />
                    </div>
                    <div class="form-actions">
                        <button class="profile-btn profile-btn-ghost" id="cancelEditProfileBtn" type="button">Cancel</button>
                        <button class="profile-btn profile-btn-primary" id="saveProfileBtn" type="submit">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Profile Picture Upload Modal -->
    <div id="profilePictureModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProfilePictureModal()">&times;</span>
            <h2>Upload Profile Picture</h2>
            <form id="profilePictureForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="profilePictureInput">Choose a picture:</label>
                    <input type="file" id="profilePictureInput" accept="image/*" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Upload</button>
<button type="button" id="removeProfilePicBtn" class="cancel-btn" style="background-color: #dc3545; color: white;">Remove Picture</button>
                    <button type="button" class="cancel-btn" onclick="closeProfilePictureModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
